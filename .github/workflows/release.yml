name: Release

# Push a tag like v0.4.0:
#   git tag v0.4.0 && git push origin v0.4.0
# The tag must match the "version" in package.json and its commit must be on
# main (the .githooks/pre-push hook checks the same before pushing). The
# workflow builds the Windows installer + portable exe and publishes a GitHub
# release with them.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check tag against package.json and main
        id: ver
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME points to $GITHUB_SHA which is not on main"
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version $PKG_VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # electron-builder must not try to publish on its own; the release is
          # created by the step below.
          GH_TOKEN: ""
        run: |
          npx vite build
          npx electron-builder --win --publish never

      - name: List artifacts
        run: ls -la release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml

